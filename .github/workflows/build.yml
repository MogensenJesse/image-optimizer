name: Build Tauri App

on:
  push:
    # Tag pushes create the real release drafts.  `main` pushes also run
    # the full build but skip release creation — they exist purely to
    # populate caches (Rust target/, libvips, x86_64 Homebrew) on the
    # default branch so subsequent tag pushes can restore from them.
    # Without this, every tag is a fully cold build.
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# Tag builds must never be cancelled mid-flight: an aborted run can leave a
# half-uploaded release asset behind.  `main` and workflow_dispatch runs are
# pure cache-warm / validation builds, so cancelling an older run when a
# newer one arrives is safe and avoids queueing backlogs on rapid merges.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lint and tests on the platforms we cannot run locally. The
  # tests call libvips, so each leg also checks the libvips that platform
  # ships. Independent of the release build below: a failure here never blocks
  # a release, but it shows up on every push.
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Ubuntu: libvips 8.18, what the release build is made with
          - platform: "ubuntu-26.04"
          # Oldest libvips we still try to support (8.12). Guards the version
          # checks in the vendored savers; not a release platform.
          - platform: "ubuntu-22.04"
          - platform: "macos-latest"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (root)
        run: npm ci

      # Platform independent, so one leg is enough
      - name: Biome (format + lint)
        if: matrix.platform == 'ubuntu-26.04'
        run: npx biome check .

      # tauri::generate_context!() needs the built frontend at compile time.
      - name: Build frontend
        run: npm run build

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev
          # Newer Ubuntu splits libheif's AV1 encoder into a plugin package
          # that libvips-dev does not pull in; AVIF output fails without it.
          # Older releases have the encoder built in and no such package.
          if apt-cache show libheif-plugin-aomenc > /dev/null 2>&1; then
            sudo apt-get install -y libheif-plugin-aomenc
          fi

      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install vips pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: rust-lint-${{ matrix.platform }}

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are built one per native runner, so each
          # gets its own libvips. A universal binary would need an Intel libvips
          # on the Apple Silicon runner, and Homebrew only ships Apple Silicon
          # bottles of it.
          - platform: "macos-latest"
            args: ""
            cache_key: "rust-aarch64-apple-darwin"
          - platform: "macos-15-intel"
            args: ""
            cache_key: "rust-x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            cache_key: "rust-x86_64-pc-windows-msvc"
          # Newest Ubuntu, so the package gets the newest libvips (8.18). The
          # price is a high glibc requirement: the AppImage and .deb only run
          # on distributions about as new as Ubuntu 26.04.
          - platform: "ubuntu-26.04"
            args: ""
            cache_key: "rust-x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # Install npm deps early so lockfile drift or a registry outage fails
      # the job before we spend minutes on Homebrew / lipo / native-lib work.
      - name: Install dependencies (root)
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: ${{ matrix.cache_key }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libheif-plugin-aomenc

      # libheif loads its AV1 encoder and decoder as plugins at run time, which
      # linuxdeploy cannot see, so the AppImage would only write AVIF on hosts
      # that happen to have the plugin packages. Ship the plugins, and libaom
      # which they need, inside the AppImage; main.rs points libheif at them.
      - name: Stage libheif AV1 plugins (Linux)
        if: runner.os == 'Linux'
        id: stage-linux
        run: |
          STAGE="$PWD/src-tauri/native-libs"
          mkdir -p "$STAGE/plugins"
          PLUGIN=$(find /usr/lib -name 'libheif-aomenc.so' | head -1)
          AOM=$(find /usr/lib -name 'libaom.so.3' | head -1)
          if [ -z "$PLUGIN" ] || [ -z "$AOM" ]; then
            echo "::error::libheif AV1 encoder ($PLUGIN) or libaom ($AOM) not found"
            exit 1
          fi
          cp "$(dirname "$PLUGIN")"/libheif-aom*.so "$STAGE/plugins/"
          cp -L "$AOM" "$STAGE/libaom.so.3"
          # libheif loads plugins with dlopen and they have no RUNPATH, so
          # point them at the AppImage's usr/lib, where libaom is placed
          for f in "$STAGE"/plugins/*.so; do
            patchelf --set-rpath '$ORIGIN/../..' "$f"
          done
          FILES="\"usr/lib/libaom.so.3\":\"$STAGE/libaom.so.3\""
          for f in "$STAGE"/plugins/*.so; do
            FILES="$FILES,\"usr/lib/libheif/plugins/$(basename "$f")\":\"$f\""
          done
          echo "{\"bundle\":{\"linux\":{\"appimage\":{\"files\":{$FILES}}}}}" > platform-config.json
          cat platform-config.json
          echo "config_args=--config platform-config.json" >> "$GITHUB_OUTPUT"

      - name: Cache libvips (Windows)
        if: runner.os == 'Windows'
        id: cache-vips
        uses: actions/cache@v5
        with:
          path: vendor/libvips-native
          key: libvips-win64-8.18.7
          restore-keys: |
            libvips-win64-

      - name: Install libvips (Windows)
        if: runner.os == 'Windows' && steps.cache-vips.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vipsVersion = "8.18.7"
          $url = "https://github.com/libvips/build-win64-mxe/releases/download/v${vipsVersion}/vips-dev-x64-web-${vipsVersion}.zip"
          Invoke-WebRequest -Uri $url -OutFile vips.zip
          Expand-Archive -Path vips.zip -DestinationPath vendor\libvips-extract
          Move-Item vendor\libvips-extract\vips-dev-8.18 vendor\libvips-native
          Remove-Item vips.zip
          Remove-Item -Recurse vendor\libvips-extract

      - name: Add libvips to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ github.workspace }}\vendor\libvips-native\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Stage native DLLs (Windows)
        if: runner.os == 'Windows'
        id: stage-windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\native-dlls
          Copy-Item vendor\libvips-native\bin\*.dll src-tauri\native-dlls\
          $count = (Get-ChildItem src-tauri\native-dlls\*.dll).Count
          Write-Host "Staged $count DLLs for bundling"
          $json = '{"bundle":{"resources":{"native-dlls/":"native-dlls"}}}'
          Set-Content -Path platform-config.json -Value $json
          echo "config_args=--config platform-config.json" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      # The cache action extracts with gtar (no sudo) and `brew link` writes
      # into several directories of /usr/local, so hand it to the runner user.
      - name: Prepare /usr/local (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: sudo chown -R "$(whoami)" /usr/local

      # Homebrew has no Intel bottles of libvips, so on the Intel runner
      # `brew install vips` compiles libvips and every dependency from source:
      # well over an hour. The result is packed into one archive (just the
      # kegs of libvips and its dependencies, not the runner's own formulae)
      # and cached right after the install, so only a cache miss pays for it.
      # Bump the key when libvips or a major dependency needs a fresh install.
      - name: Restore Homebrew kegs (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        id: cache-brew
        uses: actions/cache/restore@v5
        with:
          path: ~/homebrew-kegs.tar.gz
          key: macos-intel-homebrew-vips-v1

      # Apple Silicon installs a bottle in about two minutes.
      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          PREFIX="$(brew --prefix)"

          if [ "${{ steps.cache-brew.outputs.cache-hit }}" = "true" ]; then
            tar -C "$PREFIX" -xzf "$HOME/homebrew-kegs.tar.gz"
            # Restored kegs are installed but not linked. Keg-only formulae
            # must not be linked (Homebrew refuses), so filter them out.
            FORMULAE=$(cat "$PREFIX/kegs.txt")
            LINKABLE=$(brew info --json=v2 $FORMULAE \
              | python3 -c 'import json,sys;[print(f["name"]) for f in json.load(sys.stdin).get("formulae",[]) if not f.get("keg_only")]')
            echo "Re-linking $(echo "$LINKABLE" | grep -c . || true) restored formulae"
            if [ -n "$LINKABLE" ]; then
              brew link --overwrite $LINKABLE
            fi
          fi

          brew install vips pkgconf

          # Fail here, not later in the build, if libvips is not usable
          VIPS_PREFIX=$(brew --prefix vips 2>/dev/null || true)
          if [ -z "$VIPS_PREFIX" ] || [ ! -d "$VIPS_PREFIX/lib" ]; then
            echo "::error::Homebrew vips not available. If the cache is corrupt, bump the cache key (currently 'macos-intel-homebrew-vips-v1')."
            exit 1
          fi
          echo "VIPS_DIR=$VIPS_PREFIX" >> "$GITHUB_ENV"

          if [ "$RUNNER_ARCH" = "X64" ] && [ "${{ steps.cache-brew.outputs.cache-hit }}" != "true" ]; then
            # Pack libvips and its runtime dependencies for the cache
            FORMULAE="vips pkgconf $(brew deps --formula --union vips pkgconf)"
            echo $FORMULAE | tr ' ' '\n' | sort -u > "$PREFIX/kegs.txt"
            ENTRIES="kegs.txt"
            for f in $(cat "$PREFIX/kegs.txt"); do
              [ -e "$PREFIX/Cellar/$f" ] && ENTRIES="$ENTRIES Cellar/$f"
              [ -L "$PREFIX/opt/$f" ] && ENTRIES="$ENTRIES opt/$f"
            done
            tar -C "$PREFIX" -czf "$HOME/homebrew-kegs.tar.gz" $ENTRIES
            ls -lh "$HOME/homebrew-kegs.tar.gz"
          fi

      # Saved before the build, so a later failure does not throw away a
      # compile that took more than an hour.
      - name: Save Homebrew kegs (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.cache-brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/homebrew-kegs.tar.gz
          key: macos-intel-homebrew-vips-v1

      - name: Stage dylibs (macOS)
        if: runner.os == 'macOS'
        id: stage-macos
        run: |
          chmod +x scripts/collect-macos-dylibs.sh
          ./scripts/collect-macos-dylibs.sh src-tauri/native-libs
          FRAMEWORKS=$(cd src-tauri && find native-libs -name "*.dylib" -maxdepth 1 \
            | sort | sed 's/^/"/' | sed 's/$/"/' | paste -sd, -)
          echo "{\"bundle\":{\"macOS\":{\"frameworks\":[$FRAMEWORKS]}}}" \
            > platform-config.json
          echo "config_args=--config platform-config.json" >> $GITHUB_OUTPUT

      - name: Fix dylib install names for bundling (macOS)
        if: runner.os == 'macOS'
        run: |
          STAGING="src-tauri/native-libs"

          # Phase 1 — Change install names in the Homebrew source dylibs before
          # compilation.  The Rust linker records a dylib's ID verbatim into the
          # binary's LC_LOAD_DYLIB; after this, it records @rpath/<name> instead
          # of the absolute Homebrew path, so dyld finds the bundled copy at runtime.
          for staged in "$STAGING"/*.dylib; do
            [ -f "$staged" ] || continue
            name=$(basename "$staged")
            for brew_lib in \
                /opt/homebrew/opt/*/lib/"$name" \
                /usr/local/opt/*/lib/"$name"; do
              [ -f "$brew_lib" ] && install_name_tool -id "@rpath/$name" "$brew_lib" || true
            done
          done

          # Phase 2a — Fix each staged dylib's own ID.
          for dylib in "$STAGING"/*.dylib; do
            [ -f "$dylib" ] || continue
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
          done

          # Phase 2b — Rewrite references inside each staged dylib that point to
          # other bundled dylibs from absolute Homebrew paths to @rpath/<name>.
          # This fixes transitive loading (e.g. libvips -> libgobject-2.0).
          for dylib in "$STAGING"/*.dylib; do
            [ -f "$dylib" ] || continue
            while IFS= read -r dep; do
              depname=$(basename "$dep")
              if [ -f "$STAGING/$depname" ]; then
                install_name_tool -change "$dep" "@rpath/$depname" "$dylib" 2>/dev/null || true
              fi
            done < <(otool -L "$dylib" | awk 'NR>1 {print $1}')
          done

      # Release notes (and the in-app changelog) are the newest section only:
      # everything above the first `---` line of CHANGELOG.md.
      - name: Get changelog for release notes
        id: changelog
        shell: bash
        run: |
          if [ -f CHANGELOG.md ]; then
            DELIMITER="CHANGELOG_$(openssl rand -hex 8)"
            {
              printf '%s\n' "body<<$DELIMITER"
              tr -d '\r' < CHANGELOG.md | sed '/^---$/,$d'
              printf '\n%s\n' "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          else
            printf 'body=See the assets to download this version and install.\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled `strip` cannot read the RELR relocations of
          # current distribution libraries and fails the AppImage build
          NO_STRIP: "true"
        with:
          projectPath: .
          args: >-
            ${{ matrix.args }}
            ${{ steps.stage-windows.outputs.config_args || '' }}
            ${{ steps.stage-macos.outputs.config_args || '' }}
            ${{ steps.stage-linux.outputs.config_args || '' }}
          includeDebug: false
          # On non-tag runs (main pushes, workflow_dispatch) we want to build
          # and verify the bundle — which warms all caches — but NOT publish a
          # draft release.  tauri-action treats an empty tagName as "build
          # only": no release is created or updated.  Release metadata inputs
          # are gated on the same condition to keep behaviour symmetric.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Image Optimizer v__VERSION__' || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && steps.changelog.outputs.body || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          # Tags containing a hyphen (e.g. v0.7.0-beta.1) are treated as prereleases.
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}

      # Manual runs keep the installers as downloadable workflow artifacts, so
      # a branch can be built and tried without cutting a release.
      - name: Upload installers (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Verify bundled dylibs (macOS)
        if: runner.os == 'macOS'
        env:
          ARTIFACT_PATHS: ${{ steps.build-tauri.outputs.artifactPaths }}
        run: |
          # Tauri v2's DMG bundler deletes the .app from disk after
          # packaging it (look for "Cleaning ... Image Optimizer.app"
          # in the Build Tauri app log).  A plain `find src-tauri/target
          # -type d -name "*.app"` therefore returns nothing by the
          # time this step runs — the only .app that exists lives
          # inside the .dmg.  Mount the DMG read-only and verify the
          # .app inside it.
          DMG=""
          if [ -n "${ARTIFACT_PATHS:-}" ] && command -v jq >/dev/null 2>&1; then
            DMG=$(printf '%s' "$ARTIFACT_PATHS" \
              | jq -r '.[] | select(endswith(".dmg"))' 2>/dev/null \
              | head -1 || true)
          fi
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            DMG=$(find src-tauri/target -type f -name "*.dmg" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "::error::No DMG found to verify (searched artifactPaths and src-tauri/target)"
            exit 1
          fi
          echo "Verifying DMG at: $DMG"

          # mktemp -d gives us an empty dir that hdiutil is happy to
          # use as an explicit mountpoint.  Picking our own mountpoint
          # keeps cleanup predictable regardless of volume name.  The
          # trap detaches on any exit (success, failure, or set -e
          # abort) so a failing check never leaves a dangling mount.
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" -quiet -force >/dev/null 2>&1 || true' EXIT

          APP=$(find "$MOUNT" -maxdepth 2 -type d -name "*.app" 2>/dev/null | head -1 || true)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app bundle found inside mounted DMG"
            ls -la "$MOUNT" || true
            exit 1
          fi
          echo "Verifying bundle at: $APP"

          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          FRAMEWORKS="$APP/Contents/Frameworks"

          if [ ! -d "$FRAMEWORKS" ]; then
            echo "::error::No Frameworks directory in bundle — native-libs were not bundled"
            exit 1
          fi

          DYLIB_COUNT=$(find "$FRAMEWORKS" -maxdepth 1 -name "*.dylib" | wc -l | tr -d ' ')
          echo "Frameworks contains $DYLIB_COUNT dylibs"
          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "::error::No dylibs bundled in Frameworks/"
            exit 1
          fi

          FAIL=0

          # Check 1: no absolute Homebrew paths in the main binary or any
          # bundled dylib — those indicate install_name_tool rewrites were
          # missed and the app will fail to launch on machines without
          # Homebrew at the exact same path.
          if otool -L "$BIN" | grep -E '(/opt/homebrew|/usr/local)/' ; then
            echo "::error::Main binary references absolute Homebrew paths; install_name fixup is incomplete"
            FAIL=1
          fi
          for dylib in "$FRAMEWORKS"/*.dylib; do
            if otool -L "$dylib" | tail -n +2 | grep -E '(/opt/homebrew|/usr/local)/' ; then
              echo "::error::$(basename "$dylib") references absolute Homebrew paths"
              FAIL=1
            fi
          done

          # Check 2: every @rpath/@loader_path/@executable_path reference
          # in the main binary and each bundled dylib must have a matching
          # file in Frameworks/.  This catches transitive deps that the
          # collect script failed to follow (e.g. libwebp -> libsharpyuv).
          check_rpath_refs() {
            local target="$1"
            local target_name
            target_name=$(basename "$target")
            local local_fail=0
            local dep
            while IFS= read -r dep; do
              case "$dep" in
                @rpath/*|@loader_path/*|@executable_path/*)
                  local base
                  base=$(basename "$dep")
                  # A dylib's own ID shows up as the first otool line; skip
                  # self-references.
                  if [ "$base" = "$target_name" ]; then
                    continue
                  fi
                  if [ ! -f "$FRAMEWORKS/$base" ]; then
                    echo "::error::$target_name references $dep but Frameworks/$base is missing"
                    local_fail=1
                  fi
                  ;;
              esac
            done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
            return $local_fail
          }

          check_rpath_refs "$BIN" || FAIL=1
          for dylib in "$FRAMEWORKS"/*.dylib; do
            check_rpath_refs "$dylib" || FAIL=1
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Bundle verification failed — see errors above"
            exit 1
          fi
          echo "OK: all @rpath references resolve inside the bundle and no absolute Homebrew paths remain"

      - name: Verify native DLLs in bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsis) {
            $dlls = Get-ChildItem "$nsis\*.dll" -Recurse -ErrorAction SilentlyContinue
            Write-Host "Found $($dlls.Count) DLLs in NSIS bundle"
          }
          $dlls = Get-ChildItem "src-tauri\target\release\native-dlls\*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Host "OK: $($dlls.Count) native DLLs staged for bundling"
          } else {
            Write-Host "::warning::No native DLLs found in target — check bundle.resources config"
          }

      - name: Verify AppImage contains native libs (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::warning::No AppImage found to verify"
            exit 0
          fi
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1
          if find squashfs-root -name "libvips*" | grep -q .; then
            echo "OK: libvips found in AppImage"
          else
            echo "::warning::libvips NOT found in AppImage — users without system libvips will fail"
          fi
          # AVIF needs the libheif AV1 plugins, found through LIBHEIF_PLUGIN_PATH
          ENC=$(find squashfs-root/usr/lib/libheif/plugins -name 'libheif-aomenc.so' 2>/dev/null | head -1)
          if [ -z "$ENC" ] || [ ! -f squashfs-root/usr/lib/libaom.so.3 ]; then
            echo "::error::AV1 encoder plugin or libaom missing from the AppImage — AVIF output would fail"
            find squashfs-root -name '*heif*' -o -name 'libaom*' | head -20
            exit 1
          fi
          if ! readelf -d "$ENC" | grep -q 'RUNPATH.*\$ORIGIN/\.\./\.\.'; then
            echo "::error::AV1 plugin has no RUNPATH to the AppImage's usr/lib"
            readelf -d "$ENC" | grep -E 'RPATH|RUNPATH' || true
            exit 1
          fi
          echo "OK: AV1 encoder plugin and libaom are in the AppImage"
          rm -rf squashfs-root

      # A bundle can contain every library and still fail to start. Run it on a
      # virtual display and check it is still alive after a while.
      - name: Launch smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found"
            exit 1
          fi
          sudo apt-get install -y xvfb
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a ./squashfs-root/AppRun > app.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: the app is still running after 15 s"
            tail -n 20 app.log
            pkill -f squashfs-root || true
          else
            echo "::error::The app exited during startup"
            cat app.log
            exit 1
          fi

      - name: Launch smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG=$(find src-tauri/target -type f -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found"
            exit 1
          fi
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" -quiet -force >/dev/null 2>&1 || true' EXIT
          APP=$(find "$MOUNT" -maxdepth 2 -type d -name "*.app" | head -1)
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
          "$BIN" > app.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: the app is still running after 15 s"
            tail -n 20 app.log
            kill "$PID" || true
          else
            echo "::error::The app exited during startup"
            cat app.log
            exit 1
          fi
