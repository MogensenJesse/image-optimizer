[package]
name = "image-optimizer"
version = "0.6.10"
description = "A Tauri-based Image Optimization App"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

# Optimize release builds
[profile.release]
codegen-units = 1
panic = "unwind"  # a panicking task must fail one file, not abort the app
opt-level = 3   # Maximize speed for image processing
lto = "thin"    # ThinLTO: avoids fat-LTO bitcode failures with objc2 on macOS
strip = true    # Strip debug symbols

# Speed up debug builds
[profile.dev]
incremental = true
opt-level = 0
debug = true

# Optimize dependency crates in dev: faster hot paths while developing (build cost tradeoff).
[profile.dev.package."*"]
opt-level = 1
debug = false

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
# Minimal Tokio surface: spawn_blocking. Tauri merges its own tokio features;
# avoid `full` so we do not force compilation of unused modules (no runtime downside).
tokio = { version = "1.42", default-features = false, features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
window-vibrancy = "0.8"
libvips = { package = "libvips-rs", version = "=8.15.1" }
oxvg_optimiser = "0.0.9"
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }

# Auto-update and persistent settings
tauri-plugin-updater = "2"
tauri-plugin-store = "2"

# Override libvips-rs with a vendored patch that fixes Windows type-size mismatches.
# The upstream crate uses c_ulong/c_long for gsize/gint64 which are 32-bit on MSVC,
# causing type errors. The patch replaces these with fixed-width equivalents.
[patch.crates-io]
libvips-rs = { path = "../vendor/libvips-rs" }
